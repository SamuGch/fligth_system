
name: AirFly Frontend - Build and Push ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: airfly-frontend-ecr-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "968053437864"
  ECR_REPOSITORY: airfly-frontend

jobs:
  build-and-push:
    name: Build and Push Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        env:
          VITE_API_URL: ""
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::968053437864:role/Airfly-GitHubActions-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          test -n "$SUPABASE_URL" || {
            echo "::error::VITE_SUPABASE_URL is empty"
            exit 1
          }

          test -n "$SUPABASE_PUBLISHABLE_KEY" || {
            echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is empty"
            exit 1
          }

          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build --platform linux/amd64 \
            --build-arg API_ORIGIN="" \
            --build-arg SUPABASE_URL="$SUPABASE_URL" \
            --build-arg SUPABASE_PUBLIC_TOKEN="$SUPABASE_PUBLISHABLE_KEY" \
            --tag "$IMAGE" \
            .

          docker push "$IMAGE"

          echo "Published image: $IMAGE"

      - name: Publish image summary
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "### AirFly Frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "Image published successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "\`$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
    
      - name: Deploy frontend to K3s using SSM
        id: deploy
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "i-0aa292bf288f66c67" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy AirFly frontend" \
            --parameters "commands=[
              \"set -e\",
              \"k3s kubectl -n airfly set image deployment/airfly-frontend frontend=$IMAGE\",
              \"k3s kubectl -n airfly rollout status deployment/airfly-frontend --timeout=300s\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for K3s deployment
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0aa292bf288f66c67"

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0aa292bf288f66c67" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

